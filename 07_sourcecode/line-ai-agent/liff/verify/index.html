<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยืนยันตัวตน — Greenman</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, #F3FBF0, #E7F6E4);
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card {
    background: white; border-radius: 20px; padding: 32px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1); max-width: 360px; width: 100%;
  }
  img.avatar { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 16px; }
  h2 { margin: 0 0 8px; color: #2E7D32; }
  p { color: #555; line-height: 1.6; }
  button {
    margin-top: 16px; width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    background: #2E7D32; color: white; border: none; border-radius: 12px; cursor: pointer;
  }
  button:disabled { background: #a5c9a7; }
  .status { margin-top: 16px; font-weight: 600; }
  .status.pending { color: #EF6C00; }
  .status.approved { color: #2E7D32; }
  .status.denied { color: #c62828; }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">กำลังโหลด...</div>
    <div id="content" style="display:none;">
      <img id="avatar" class="avatar" src="" alt="">
      <h2>สวัสดีครับ, <span id="name"></span></h2>
      <p>กดยืนยันตัวตนเพื่อขอใช้งาน Greenman ผู้ช่วยงาน dh-task ผ่านไลน์ครับ<br>
         หลังยืนยันแล้ว รอแอดมินอนุมัติอีกครั้งนะครับ</p>
      <button id="verifyBtn" onclick="verify()">✅ ยืนยันตัวตน</button>
      <div id="statusMsg"></div>
    </div>
  </div>

<script>
let profile = null;

async function main() {
  const cfgRes = await fetch('/api/liff/config');
  const cfg = await cfgRes.json();
  if (!cfg.liff_id) {
    document.getElementById('loading').innerText = 'ยังไม่ได้ตั้งค่า LIFF_ID บนเซิร์ฟเวอร์ครับ';
    return;
  }
  await liff.init({ liffId: cfg.liff_id });
  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }
  profile = await liff.getProfile();
  document.getElementById('avatar').src = profile.pictureUrl || '';
  document.getElementById('name').innerText = profile.displayName || '';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

async function verify() {
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.innerText = 'กำลังส่งคำขอ...';
  try {
    const res = await fetch('/api/liff/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: profile.userId, display_name: profile.displayName || '' }),
    });
    const data = await res.json();
    const el = document.getElementById('statusMsg');
    if (data.status === 'approved') {
      el.className = 'status approved';
      el.innerText = 'คุณได้รับการอนุมัติแล้วครับ ✅ กลับไปแชทกับ Greenman ได้เลย';
    } else if (data.status === 'denied') {
      el.className = 'status denied';
      el.innerText = 'คำขอของคุณไม่ได้รับการอนุมัติครับ';
    } else {
      el.className = 'status pending';
      el.innerText = 'ส่งคำขอแล้วครับ กำลังรอแอดมินอนุมัติ ⏳';
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerText = '✅ ยืนยันตัวตน';
    document.getElementById('statusMsg').innerText = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
  }
}

main();
</script>
</body>
</html>
